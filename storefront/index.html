<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="E-Buy Uganda is the trusted marketplace to buy and sell new, refurbished and used items across Kampala, Wakiso, Mukono, Mbarara, Gulu and beyond. Pay with MTN MoMo or Airtel Money and chat with sellers on WhatsApp."
    />
    <meta name="theme-color" content="#15803d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>E-Buy Uganda | Buy &amp; Sell New, Refurbished and Used Items</title>
    <script>
      // Apply the saved (or system) colour scheme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem("ebuy:theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || (saved !== "light" && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>E-Buy Uganda needs JavaScript to browse the catalogue.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
